}

android {
    namespace 'com.wu4nz.tkcolor'
    compileSdk 34

    defaultConfig {
        applicationId 'com.wu4nz.tkcolor'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly 'de.robv.android.xposed:api:82'
}
